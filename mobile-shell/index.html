<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F59E0B">
    <title>KotBean</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(160deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            font-family: system-ui, sans-serif;
            padding: 24px;
            text-align: center;
        }
        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="logo">K</div>
    <p>Opening KotBean…</p>
    <p style="font-size: 0.85rem; opacity: 0.85;">Set <code>CAPACITOR_SERVER_URL</code> to your server address for the native app.</p>
</body>
</html>
