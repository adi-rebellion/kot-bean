version: '3.8'

services:
  kotbean-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - kotbean-db
      - kotbean-redis
    networks:
      - kotbean_internal

  kotbean-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kotbean
      MYSQL_ROOT_PASSWORD: kotbean
      MYSQL_PASSWORD: kotbean
      MYSQL_USER: kotbean
    volumes:
      - /opt/data_volumes/aditya/kotbean/mysql_data:/var/lib/mysql
    networks:
      - kotbean_internal

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: kotbean-db
      PMA_PORT: 3306
      PMA_USER: kotbean
      PMA_PASSWORD: kotbean
    depends_on:
      - kotbean-db
    networks:
      - kotbean_internal

  kotbean-redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    networks:
      - kotbean_internal

  kotbean-web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:27082:80"
    volumes:
      - .:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - kotbean-app
    networks:
      - kotbean_internal
      - rproxynet

volumes:
  redisdata:

networks:
  kotbean_internal:
    driver: bridge
  rproxynet:
    external: true
    name: nginx_rproxynet
