<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline — KotBean</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: system-ui, sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }
        .card {
            max-width: 360px;
            text-align: center;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 32px 24px;
        }
        h1 { font-size: 1.25rem; margin: 0 0 8px; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; }
        button {
            border: 0;
            border-radius: 12px;
            background: #f59e0b;
            color: #fff;
            font-weight: 600;
            padding: 12px 20px;
            font-size: 0.95rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>You’re offline</h1>
        <p>KotBean needs an internet connection. Check your network and try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
